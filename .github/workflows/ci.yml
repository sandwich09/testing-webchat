# Every action is pinned to the full commit SHA of a release (the trailing comment names the
# version), and the gitleaks release archive to its SHA-256. Update each pair together.
name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read

# A run already in progress is never cancelled: each pushed commit that starts gets a result, so
# a failing check stays visible on that commit. GitHub still keeps one pending run per group and
# drops an older pending one, which is why the destructive check scans every migration file and
# the deploy job deploys only the commit that is still the head of main.
concurrency:
  group: ci-main
  cancel-in-progress: false

env:
  TZ: UTC

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Full history: the migration checks compare the pushed commit with its first parent, and a
      # branch run with the merge base of origin/main, which a shallow clone does not have.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrations:immutable
      - run: pnpm migrations:destructive
      - run: pnpm docs:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: coverage-report, path: coverage, retention-days: 30 }
      - run: pnpm build

  adapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --build --wait db stub
      - run: pnpm test:adapters
      - if: failure()
        run: docker compose logs db stub

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose build
      - run: docker compose up -d --wait db stub app
      - run: docker compose run --rm seed
      # The tests run in the Playwright image, which already holds Chromium and its system
      # packages, so the job does not download them from the Ubuntu mirror on every run. The
      # tag must equal the @playwright/test version in package.json; update the digest with it.
      - name: Run the E2E tests in the Playwright container
        run: |
          docker run --rm --network host --ipc host -e CI=true -e TZ=UTC \
            -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 \
            npx playwright test
      - if: failure()
        run: docker compose logs app stub
      # Kept for every run, not only failures, so the report of a green run can be read too.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright-report, path: playwright-report, retention-days: 30 }

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: pnpm audit --audit-level high
      - name: Scan the history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location --output gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tgz
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner

  deploy:
    needs: [check, adapters, e2e, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
        # Without the secret the checks above still gate main; the deploy starts once it is set.
        # The hook builds whatever main is when it is called, so it is called only while main is
        # still the commit these jobs tested; a newer commit's own run deploys that one.
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK_URL is not set, so the deploy is skipped."
            exit 0
          fi
          MAIN_SHA=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.sha" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/main")
          if [ "$MAIN_SHA" != "$TESTED_SHA" ]; then
            echo "::notice::main is now $MAIN_SHA, not the tested $TESTED_SHA, so the deploy is skipped."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL" > /dev/null
